<section class="hero">
  <!-- Looping background video -->
  <video #heroVideo class="hero__video" autoplay muted loop playsinline preload="auto">
    <source src="hero-bg2.mp4" type="video/mp4" />
  </video>

  <!-- Overlay -->
  <div class="hero__overlay"></div>

  <!-- Content on top of video -->
  <div class="hero__content">
    <p class="hero__pre">We are getting engaged</p>

    <h1 class="hero__names-text">Sowndarya Gowda D M</h1>
    <h1 class="hero__names-heart">&#128149;</h1>
    <h1 class="hero__names-text">Pramoda K M</h1>

    <!-- <p class="hero__date">18 · 09 · 2026</p> -->

  </div>

  <!-- Scroll down arrow -->
  <div class="hero__scroll" aria-hidden="true">
    <span class="hero__scroll-label">Scroll</span>
    <svg class="hero__scroll-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
    <svg class="hero__scroll-arrow hero__scroll-arrow--2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </div>

</section>
