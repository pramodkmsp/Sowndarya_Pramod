<div class="spinner" role="status" aria-label="Loading">
  <svg class="spinner__svg" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
    <!-- Outer rotating ring -->
    <circle
      class="spinner__ring spinner__ring--outer"
      cx="40" cy="40" r="34"
      fill="none"
      stroke="#c9a96e"
      stroke-width="3"
      stroke-linecap="round"
    />
    <!-- Inner interlocking circle -->
    <circle
      class="spinner__ring spinner__ring--inner"
      cx="40" cy="40" r="22"
      fill="none"
      stroke="#e8b4b8"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    <!-- Center dot -->
    <circle cx="40" cy="40" r="3" fill="#c9a96e" class="spinner__dot"/>
  </svg>
  <p class="spinner__text">A moment...</p>
</div>
